<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Winchester — cribbage scoring practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <button type="button" id="gear" aria-label="Settings" title="Settings">
      <svg viewBox="-12 -12 24 24" aria-hidden="true">
        <g class="teeth">
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1"/>
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1" transform="rotate(45)"/>
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1" transform="rotate(90)"/>
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1" transform="rotate(135)"/>
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1" transform="rotate(180)"/>
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1" transform="rotate(225)"/>
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1" transform="rotate(270)"/>
          <rect x="-1.6" y="-9.8" width="3.2" height="4.8" rx="1" transform="rotate(315)"/>
        </g>
        <circle class="body" r="6"/>
      </svg>
    </button>
  </header>

  <section class="board">
    <svg id="board" aria-label="cribbage board"></svg>
  </section>

  <section id="play">
    <div id="flash" aria-hidden="true"></div>
    <div id="hand-area"></div>

    <div id="pregame">
      <button type="button" id="start">Start</button>
    </div>

    <form id="guess-form" autocomplete="off" hidden>
      <input id="guess" type="text" inputmode="numeric" pattern="[0-9]*"
             maxlength="2" placeholder="?" aria-label="score for this hand">
      <button type="submit">Score it</button>
    </form>

    <div id="keypad" hidden></div>

    <p id="status"></p>
  </section>

  <section id="review" hidden>
    <h1 id="outcome"></h1>
    <p id="tally"></p>
    <button type="button" id="again">Play again</button>
    <div id="log-area"></div>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>Settings</h2>

    <div class="setting">
      <label for="set-pegs">Points for a right answer</label>
      <input type="range" id="set-pegs" min="2" max="30" step="2">
      <output id="out-pegs"></output>
    </div>

    <div class="setting">
      <label for="set-pace">Opponent's seconds per turn</label>
      <input type="range" id="set-pace" min="2" max="30" step="1">
      <output id="out-pace"></output>
    </div>

    <div class="setting">
      <label for="set-to">Play to</label>
      <input type="range" id="set-to" min="31" max="121" step="30">
      <output id="out-to"></output>
    </div>

    <p id="set-note"></p>

    <div class="buttons">
      <button type="button" id="set-cancel">Cancel</button>
      <button type="submit" id="set-apply" value="apply">Apply</button>
    </div>
  </form>
</dialog>

<script>
// If ui.mjs never runs -- a stale cached module whose exports have moved, a typo,
// a 404 -- every drawn thing is simply absent and the page looks like a design
// decision.  Say so instead.  Deliberately not a module, so it survives whatever
// the module graph is doing.
function bootTrouble (detail) {
  if (document.getElementById('boot-error')) return;

  const note = document.createElement('p');
  note.id = 'boot-error';
  note.textContent = `Nothing loaded: ${detail}. `
    + 'A hard reload (shift-reload) clears a stale cached module.';

  document.body.prepend(note);
}

addEventListener('error', (event) => bootTrouble(event.message || 'script error'));
setTimeout(() => { if (! window.winchesterReady) bootTrouble('ui.mjs never started') }, 2000);
</script>

<script type="module" src="ui.mjs"></script>

</body>
</html>
